services:
  mariadb:
    image: mariadb:12.3.3
    container_name: flashseat-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: flashseat_db
      MARIADB_USER: flashseat
      MARIADB_PASSWORD: flashseat123

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
