services:
  mariadb:
    image: mariadb:12.3.3
    container_name: marketing-ai-agent-team-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in infrastructure/.env}
      MARIADB_DATABASE: marketing_ai_agent_team_db
      MARIADB_USER: marketing_ai_agent_team
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in infrastructure/.env}
    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
