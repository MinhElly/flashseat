spring:
  application:
    name: flashseat
  datasource:
    url: jdbc:mariadb://localhost:3307/flashseat_db
    username: ${DB_USERNAME:flashseat}
    password: ${DB_PASSWORD:flashseat123}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration